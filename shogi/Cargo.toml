[package]
name = "kishi-shogi"
description = "Kishi's shogi engine: rules, alpha-beta search and evaluation, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports the C ABI the web page calls. Only for building web/shogi.wasm.
web = []

[dependencies]
kishi-engine = { path = "../engine" }
