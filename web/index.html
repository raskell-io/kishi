<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Kishi · chess</title>
  <meta name="description" content="Play chess against Kishi, an engine trained by self-play that runs entirely on your device.">
  <meta name="theme-color" content="#161512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kishi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="modulepreload" href="board.js">
  <link rel="modulepreload" href="engine.js">
  <link rel="preload" href="kishi.wasm" as="fetch" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./"><img src="icon.svg" alt="" width="26" height="26"><span>Kishi</span><small>騎士</small></a>
    <button id="settings" class="icon" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.11-1.65-2-3.46-2.49 1a7.5 7.5 0 0 0-1.68-.98L15 3.3h-4l-.37 2.64c-.6.25-1.17.58-1.68.98l-2.49-1-2 3.46 2.11 1.65a7.8 7.8 0 0 0 0 1.94l-2.11 1.65 2 3.46 2.49-1c.51.4 1.08.73 1.68.98L11 20.7h4l.37-2.64c.6-.25 1.17-.58 1.68-.98l2.49 1 2-3.46-2.11-1.65Z"/></svg>
    </button>
  </header>

  <main class="app">
    <section class="play">
      <div class="player" id="top"></div>
      <div class="board-wrap">
        <div id="board"></div>
        <div id="promotion" hidden></div>
        <div id="gameover" hidden>
          <div class="card">
            <div class="headline"></div>
            <div class="reason"></div>
            <div class="actions">
              <button id="rematch" class="primary">Rematch</button>
              <button id="again">New game</button>
            </div>
          </div>
        </div>
      </div>
      <div class="player" id="bottom"></div>
    </section>

    <aside class="side">
      <div class="moves" id="moves"></div>
      <nav class="history">
        <button id="first" class="icon" aria-label="First move"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14l-10-7z"/></svg></button>
        <button id="prev" class="icon" aria-label="Previous move"><svg viewBox="0 0 24 24"><path d="M16 5v14L6 12z"/></svg></button>
        <button id="next" class="icon" aria-label="Next move"><svg viewBox="0 0 24 24"><path d="M8 5v14l10-7z"/></svg></button>
        <button id="last" class="icon" aria-label="Last move"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg></button>
      </nav>
      <nav class="controls">
        <button id="new"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg><span>New</span></button>
        <button id="takeback"><svg viewBox="0 0 24 24"><path d="M9 7V3L2 10l7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11Z"/></svg><span>Takeback</span></button>
        <button id="flip"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4V9h11V7H7zM17 12v3H6v2h11v3l4-4z"/></svg><span>Flip</span></button>
        <button id="resign"><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zM8 4h11l-2.5 4L19 12H8z"/></svg><span>Resign</span></button>
        <button id="share"><svg viewBox="0 0 24 24"><path d="M12 3 7.5 7.5l1.4 1.4L11 6.8V15h2V6.8l2.1 2.1 1.4-1.4zM5 12v8h14v-8h-2v6H7v-6z"/></svg><span>PGN</span></button>
      </nav>
      <p class="about">Kishi runs entirely on this device: a Rust engine compiled to WebAssembly, with an evaluation network trained by self-play. No server, works offline.</p>
    </aside>
  </main>

  <dialog id="newgame">
    <form method="dialog">
      <h2>Play Kishi</h2>
      <div class="levels"></div>
      <div class="colors">
        <button value="b" aria-label="Play black"><i class="piece bK"></i></button>
        <button value="random" class="random" aria-label="Random color"><i class="piece wK half"></i><i class="piece bK half"></i></button>
        <button value="w" aria-label="Play white"><i class="piece wK"></i></button>
      </div>
      <button value="cancel" class="close" aria-label="Close">×</button>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="toggle"><input type="checkbox" id="opt-eval"><span>Show Kishi's evaluation</span></label>
      <label class="toggle"><input type="checkbox" id="opt-sound"><span>Move sounds</span></label>
      <p class="credits" id="engine-info"></p>
      <p class="credits">Pieces by Colin M.L. Burnett (GPLv2+). Engine and network: <a href="https://github.com/raskell-io/kishi">raskell-io/kishi</a>.</p>
      <button value="ok" class="primary">Done</button>
    </form>
  </dialog>

  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
